services:
  - type: web
    name: makeup-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: makeup-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com
      - key: MODEL_DIR
        value: /app/artifacts
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /
    autoDeploy: true

  - type: database
    name: makeup-db
    databaseName: makeupdb
    plan: free
    ipAllowList: []
