services:
  - type: web
    name: makeup-api
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: makeup-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com
      - key: MODEL_DIR
        value: ./artifacts
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /
    autoDeploy: true

  - type: database
    name: makeup-db
    databaseName: makeupdb
    plan: free
    ipAllowList: []
